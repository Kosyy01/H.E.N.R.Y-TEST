<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H.E.N.R.Y. — Prywatny dostęp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg:#050507; --fg:#f5f3fa; --muted:#888394;
  --line:rgba(255,255,255,.09); --violet:#a78bfa; --font:"Sora",system-ui,sans-serif;
}
*,*:before,*:after{box-sizing:border-box;font-family:var(--font)!important}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;background:
  radial-gradient(circle at 50% 42%,rgba(113,80,180,.11),transparent 28%),
  radial-gradient(circle at 50% 100%,rgba(110,77,190,.06),transparent 40%),var(--bg);
  color:var(--fg);font-family:var(--font);cursor:none;-webkit-font-smoothing:antialiased;
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:20;
  background:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
             linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(circle at center,black,transparent 78%);
}
#boot{
  position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#050507;
  transition:opacity .8s ease,visibility .8s ease;
}
#boot.hide{opacity:0;visibility:hidden}
.boot-inner{text-align:center;letter-spacing:.18em;color:#9d96aa;font-size:10px;text-transform:uppercase}
.boot-mark{
  width:42px;height:42px;margin:0 auto 18px;border:1px solid rgba(167,139,250,.35);
  border-radius:50%;display:grid;place-items:center;position:relative;animation:pulse 1.5s ease-in-out infinite;
}
.boot-mark:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--violet);box-shadow:0 0 18px var(--violet)}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(167,139,250,.02),0 0 34px rgba(167,139,250,.18)}}
.shell{height:100dvh;min-height:640px;position:relative;display:flex;flex-direction:column;opacity:0;transform:scale(1.01);transition:opacity 1.1s ease,transform 1.1s ease}
.shell.ready{opacity:1;transform:none}
.time{position:absolute;top:38px;right:42px;text-align:right;opacity:0;animation:reveal .8s .45s forwards}
.time-main{font-size:25px;font-weight:400;letter-spacing:-.04em}
.time-date{font-size:9px;color:var(--muted);margin-top:7px;letter-spacing:.16em;text-transform:uppercase}
main{flex:1;display:grid;place-items:center;position:relative}
.center{position:relative;text-align:center;margin-top:-3vh}
.eyebrow{font-size:9px;color:#777181;letter-spacing:.26em;text-transform:uppercase;margin-bottom:20px;opacity:0;animation:reveal .7s .5s forwards}
.orb-wrap{width:250px;height:250px;margin:auto;position:relative;display:grid;place-items:center;opacity:0;animation:reveal 1s .55s forwards}
.orb-wrap:before,.orb-wrap:after{
  content:"";position:absolute;border-radius:50%;inset:12%;border:1px solid rgba(167,139,250,.15);
  animation:spin 14s linear infinite;
}
.orb-wrap:after{inset:2%;border-color:rgba(255,255,255,.05);animation-duration:22s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.orb{
  width:150px;height:150px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 40% 33%,rgba(220,211,255,.92) 0 1.5%,transparent 3%),
             radial-gradient(circle at 56% 48%,rgba(167,139,250,.5),transparent 35%),
             radial-gradient(circle at 50% 50%,#171122 0 47%,#0c0a10 69%,transparent 70%);
  box-shadow:0 0 30px rgba(167,139,250,.22),0 0 85px rgba(125,91,196,.12),inset 0 0 35px rgba(196,181,253,.12);
  animation:float 5s ease-in-out infinite;transform-style:preserve-3d;
}
.orb:before{
  content:"";position:absolute;inset:19px;border-radius:50%;border:1px solid rgba(196,181,253,.25);
  box-shadow:inset 0 0 20px rgba(167,139,250,.12);transform:rotateX(64deg) rotateZ(12deg);
}
.orb:after{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 20%,rgba(196,181,253,.34) 22%,transparent 25% 55%,rgba(167,139,250,.28) 58%,transparent 61%);
  mask-image:radial-gradient(circle,transparent 59%,black 60%,black 63%,transparent 64%);
  animation:spin 7s linear infinite reverse;
}
@keyframes float{50%{transform:translateY(-8px) rotateY(8deg)}}
.orb-glow{position:absolute;width:220px;height:90px;background:rgba(129,91,210,.16);filter:blur(42px);border-radius:50%;bottom:12px}
.agent{margin-top:23px;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#bdb6c9;opacity:0;animation:reveal .8s .85s forwards}
.agent strong{color:#eeeaf4;font-weight:500}
.welcome{margin-top:17px;font-size:27px;letter-spacing:-.045em;font-weight:400;opacity:0;animation:reveal .8s .95s forwards}
.welcome span{color:#9b93a6}
.prompt{margin:10px 0 27px;color:#777181;font-size:11px;opacity:0;animation:reveal .8s 1.05s forwards}
.access{
  width:min(430px,84vw);height:58px;margin:auto;position:relative;
  border:1px solid rgba(255,255,255,.105);
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
  border-radius:14px;display:flex;align-items:center;padding:0 7px 0 18px;
  box-shadow:0 18px 55px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.035);
  opacity:0;animation:reveal .8s 1.15s forwards;
  transition:border-color .25s,box-shadow .25s,background .25s,transform .25s;
}
.access:focus-within{
  border-color:rgba(167,139,250,.52);
  background:linear-gradient(180deg,rgba(167,139,250,.055),rgba(255,255,255,.018));
  box-shadow:0 0 0 4px rgba(167,139,250,.055),0 24px 70px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.045);
  transform:translateY(-1px);
}
.access-icon{width:17px;height:17px;flex:0 0 17px;color:#827b8d;margin-right:12px;transition:color .25s,filter .25s}
.access:focus-within .access-icon{color:#b9a7df;filter:drop-shadow(0 0 8px rgba(167,139,250,.35))}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:#f1edf7;font:400 12px var(--font);letter-spacing:.01em;cursor:none}
input::placeholder{color:#67616f;transition:opacity .2s}
input:focus::placeholder{opacity:.45}
.submit{
  width:42px;height:42px;flex:0 0 42px;border:1px solid rgba(255,255,255,.08);border-radius:10px;
  background:rgba(255,255,255,.045);color:#aaa2b8;display:grid;place-items:center;cursor:none;transition:.22s;
}
.submit svg{width:17px;height:17px;transition:transform .22s}
.submit:hover{background:rgba(167,139,250,.13);color:#eee8f7;border-color:rgba(167,139,250,.32);box-shadow:0 0 20px rgba(167,139,250,.09)}
.submit:hover svg{transform:translate(2px,-2px)}
.hint{font-size:8px;color:#4e4a55;letter-spacing:.12em;margin-top:14px;text-transform:uppercase;display:flex;justify-content:center;gap:8px;opacity:0;animation:reveal .8s 1.25s forwards}
.error{height:15px;margin-top:12px;font-size:9px;color:#b79fd4;opacity:0;transition:opacity .25s}
.error.show{opacity:1}
.status{position:absolute;bottom:32px;left:42px;display:flex;align-items:center;gap:9px;color:#65606d;font-size:8px;letter-spacing:.16em;text-transform:uppercase;opacity:0;animation:reveal .8s 1.4s forwards}
.status b{width:5px;height:5px;border-radius:50%;background:#8e7ac3;box-shadow:0 0 9px #8e7ac3}
.secure{position:absolute;bottom:32px;right:42px;color:#4e4a55;font-size:8px;letter-spacing:.14em;text-transform:uppercase;opacity:0;animation:reveal .8s 1.5s forwards}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#cursor{position:fixed;z-index:100;pointer-events:none;width:22px;height:22px;border:1px solid rgba(201,189,230,.7);border-radius:50%;transform:translate(-50%,-50%);transition:width .18s,height .18s,border-color .18s,background .18s;mix-blend-mode:screen}
#cursor-dot{position:fixed;z-index:101;pointer-events:none;width:3px;height:3px;background:#d8d0e8;border-radius:50%;transform:translate(-50%,-50%)}
body.hovering #cursor{width:34px;height:34px;border-color:rgba(167,139,250,.9);background:rgba(167,139,250,.08)}
@media(max-width:700px){
  .time{top:24px;right:20px}.time-main{font-size:20px}.welcome{font-size:22px}
  .orb-wrap{width:210px;height:210px}.orb{width:125px;height:125px}
  .status{left:20px;bottom:22px}.secure{right:20px;bottom:22px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div id="boot"><div class="boot-inner"><div class="boot-mark"></div><div>Uruchamianie prywatnego środowiska</div></div></div>
<div id="cursor"></div><div id="cursor-dot"></div>
<section class="shell" id="shell">
  <div class="time"><div class="time-main" id="clock">--:--:--</div><div class="time-date" id="date">Warszawa</div></div>
  <main>
    <div class="center">
      <div class="eyebrow">Bezpieczny interfejs uwierzytelniania</div>
      <div class="orb-wrap"><div class="orb-glow"></div><div class="orb"></div></div>
      <div class="agent">H. <strong>E. N. R. Y.</strong></div>
      <div class="welcome">Dzień Dobry, <span>Aleks W.</span></div>
      <div class="prompt">Proszę podać hasło, aby załadować całą zawartość.</div>
      <form class="access" id="login">
        <i class="access-icon" data-lucide="lock-keyhole"></i>
        <input id="password" type="password" autocomplete="off" placeholder="Wprowadź hasło dostępu…" aria-label="Hasło dostępu">
        <button class="submit" type="submit" aria-label="Zatwierdź dostęp"><i data-lucide="arrow-up-right"></i></button>
      </form>
      <div class="error" id="error"></div>
      <div class="hint"><span>Szyfrowana sesja</span><span>·</span><span>Dostęp lokalny</span></div>
    </div>
  </main>
  <div class="status"><b></b> System aktywny · H.E.N.R.Y. oczekuje</div>
  <div class="secure">Warszawa / Europa-Warszawa · Bezpieczny kanał</div>
</section>
<script>
const shell=document.getElementById('shell');
const boot=document.getElementById('boot');
const clock=document.getElementById('clock');
const date=document.getElementById('date');
const form=document.getElementById('login');
const password=document.getElementById('password');
const error=document.getElementById('error');

setTimeout(()=>{
  boot.classList.add('hide');
  shell.classList.add('ready');
  setTimeout(()=>password.focus(),850);
},1050);

function updateClock(){
  const now=new Date();
  const parts=new Intl.DateTimeFormat('pl-PL',{timeZone:'Europe/Warsaw',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(now);
  const get=k=>parts.find(x=>x.type===k)?.value||'';
  clock.textContent=`${get('hour')}:${get('minute')}:${get('second')}`;
  date.textContent=`${new Intl.DateTimeFormat('pl-PL',{timeZone:'Europe/Warsaw',weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(now)} · Warszawa`;
}
updateClock(); setInterval(updateClock,1000);

form.addEventListener('submit',e=>{
  e.preventDefault();
  error.textContent=password.value.trim()?'Tryb demonstracyjny: tutaj należy podłączyć własne uwierzytelnianie.':'Proszę podać hasło dostępu.';
  error.classList.add('show');
  if(!password.value.trim()) password.focus(); else password.select();
});

if(window.lucide) lucide.createIcons();

const cursor=document.getElementById('cursor'),dot=document.getElementById('cursor-dot');
let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
function animateCursor(){
  cx+=(mx-cx)*.18;cy+=(my-cy)*.18;
  cursor.style.left=cx+'px';cursor.style.top=cy+'px';
  dot.style.left=mx+'px';dot.style.top=my+'px';
  requestAnimationFrame(animateCursor);
}
animateCursor();
document.querySelectorAll('button,input').forEach(el=>{
  el.addEventListener('mouseenter',()=>document.body.classList.add('hovering'));
  el.addEventListener('mouseleave',()=>document.body.classList.remove('hovering'));
});
const orb=document.querySelector('.orb');
addEventListener('mousemove',e=>{
  const x=(e.clientX/innerWidth-.5)*10,y=(e.clientY/innerHeight-.5)*10;
  orb.style.transform=`translate(${x*.35}px,${y*.35}px) rotateY(${x}deg) rotateX(${-y}deg)`;
});
</script>
</body>
</html>
